name: Build POC TrollStore App

on:
  push:
    paths:
      - 'poc-trollstore/**'
      - '.github/workflows/poc-trollstore.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz

      - name: Set up Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone --quiet --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Download iOS SDK
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          cd "$THEOS/sdks"
          curl -sL https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk . || true
          rm -rf sdks-master sdks.zip
          ls -1

      - name: Build and stage .app
        env:
          THEOS: ${{ github.workspace }}/theos
        working-directory: poc-trollstore
        run: |
          # 'stage' compiles + signs the .app into the staging dir without
          # producing a .deb. FINALPACKAGE strips debug symbols.
          make clean || true
          make stage FINALPACKAGE=1
          echo "--- staging tree ---"
          find .theos -maxdepth 4 -name '*.app' -type d || true
          APP=".theos/_/Applications/TouchPOC.app"
          if [ ! -d "$APP" ]; then
            APP=$(find .theos/_ -maxdepth 6 -name 'TouchPOC.app' -type d | head -n1)
          fi
          if [ -z "$APP" ]; then
            echo "ERROR: TouchPOC.app not found after stage."
            exit 1
          fi
          if [ ! -f "$APP/Info.plist" ]; then
            echo "Info.plist missing from staged app; copying project Info.plist into bundle root."
            cp Info.plist "$APP/Info.plist"
          fi
          test -f "$APP/Info.plist"

      - name: Build tunnel extension
        env:
          THEOS: ${{ github.workspace }}/theos
        working-directory: poc-trollstore/TunnelExtension
        run: |
          make clean || true
          make stage FINALPACKAGE=1
          echo "--- extension staging tree ---"
          find .theos -maxdepth 8 -type d | sort

      - name: Embed tunnel extension
        working-directory: poc-trollstore
        run: |
          set -e
          APP=".theos/_/Applications/TouchPOC.app"
          if [ ! -d "$APP" ]; then
            APP=$(find .theos/_ -maxdepth 6 -name 'TouchPOC.app' -type d | head -n1)
          fi
          if [ -z "$APP" ]; then
            echo "ERROR: TouchPOC.app not found before embedding extension."
            exit 1
          fi
          BIN=$(find TunnelExtension/.theos -maxdepth 8 -type f -name 'TouchPOCTunnel' ! -path '*/dSYM/*' | head -n1)
          if [ -z "$BIN" ]; then
            echo "ERROR: TouchPOCTunnel executable not found."
            find TunnelExtension/.theos -maxdepth 8 -type f | sort
            exit 1
          fi
          mkdir -p "$APP/PlugIns/TouchPOCTunnel.appex"
          rm -rf "$APP/PlugIns/TouchPOCTunnel.appex"/*
          cp TunnelExtension/Info.plist "$APP/PlugIns/TouchPOCTunnel.appex/Info.plist"
          cp "$BIN" "$APP/PlugIns/TouchPOCTunnel.appex/TouchPOCTunnel"
          chmod 755 "$APP/PlugIns/TouchPOCTunnel.appex/TouchPOCTunnel"
          ldid -STunnelExtension/entitlements.plist "$APP/PlugIns/TouchPOCTunnel.appex/TouchPOCTunnel"
          test -f "$APP/PlugIns/TouchPOCTunnel.appex/Info.plist"
          test -f "$APP/PlugIns/TouchPOCTunnel.appex/TouchPOCTunnel"
          echo "Using app for embed: $APP"
          echo "Using executable: $BIN"
          echo "--- embedded extension files ---"
          find "$APP/PlugIns/TouchPOCTunnel.appex" -maxdepth 2 -type f | sort
          echo "--- embedded extension binary type ---"
          file "$APP/PlugIns/TouchPOCTunnel.appex/TouchPOCTunnel" || true
          echo "--- re-sign app after embedding extension ---"
          ldid -Sentitlements.plist "$APP/TouchPOC"

      - name: Package .tipa
        working-directory: poc-trollstore
        run: |
          set -e
          # Find the signed .app produced by the stage step.
          APP=".theos/_/Applications/TouchPOC.app"
          if [ ! -d "$APP" ]; then
            APP=$(find .theos/_ -maxdepth 6 -name 'TouchPOC.app' -type d | head -n1)
          fi
          if [ -z "$APP" ]; then
            echo "ERROR: TouchPOC.app not found in staging output."
            find .theos -maxdepth 5 -type d | head -100
            exit 1
          fi
          echo "Found app: $APP"
          if [ ! -f "$APP/Info.plist" ]; then
            echo "Info.plist missing from staged app; copying project Info.plist into bundle root."
            cp Info.plist "$APP/Info.plist"
          fi
          if [ ! -f "$APP/Info.plist" ]; then
            echo "ERROR: $APP/Info.plist is still missing. TrollStore will reject this package."
            exit 1
          fi
          rm -rf _payload
          mkdir -p _payload/Payload
          cp -R "$APP" _payload/Payload/TouchPOC.app
          if [ ! -f _payload/Payload/TouchPOC.app/Info.plist ]; then
            echo "ERROR: Payload/TouchPOC.app/Info.plist missing after copy."
            find _payload -maxdepth 4 -type f | sort
            exit 1
          fi
          mkdir -p packages
          rm -f packages/TouchPOC.tipa
          ( cd _payload && zip -qr9 ../packages/TouchPOC.tipa Payload )
          unzip -l packages/TouchPOC.tipa | grep 'Payload/TouchPOC.app/Info.plist'
          unzip -l packages/TouchPOC.tipa | grep 'Payload/TouchPOC.app/PlugIns/TouchPOCTunnel.appex/Info.plist'
          unzip -l packages/TouchPOC.tipa | grep 'Payload/TouchPOC.app/PlugIns/TouchPOCTunnel.appex/TouchPOCTunnel'
          echo "--- final app entitlements ---"
          ldid -e "$APP/TouchPOC" || true
          echo "--- final extension entitlements ---"
          ldid -e "$APP/PlugIns/TouchPOCTunnel.appex/TouchPOCTunnel" || true
          ls -la packages

      - name: Locate artifact
        id: artifact
        working-directory: poc-trollstore
        run: |
          FILE=$(ls -1 packages/*.tipa 2>/dev/null | head -n1 || true)
          if [ -z "$FILE" ]; then
            echo "No .tipa produced."
            exit 1
          fi
          echo "path=poc-trollstore/$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchPOC-tipa
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
